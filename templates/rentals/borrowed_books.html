{% extends 'base.html' %}

{% block content %}

<h2>Borrowed Books</h2>

{% for rental in rentals %}

<div class="card mb-3">

    <div class="card-body">

        <h5>{{ rental.book.title }}</h5>

        <p>Status: {{ rental.status }}</p>

        <a href="{% url 'return_book' rental.id %}"
           class="btn btn-warning">

           Return Book

        </a>

    </div>

</div>

{% endfor %}

{% endblock %}
