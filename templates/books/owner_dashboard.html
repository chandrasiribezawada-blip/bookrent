{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Owner Dashboard</h2>

<div class="row">

    <div class="col-md-3">
        <div class="card text-center shadow">
            <div class="card-body">
                <h3>{{ total_books }}</h3>
                <p>Total Books</p>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-center shadow">
            <div class="card-body">
                <h3>{{ available_books }}</h3>
                <p>Available Books</p>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-center shadow">
            <div class="card-body">
                <h3>{{ pending_requests }}</h3>
                <p>Pending Requests</p>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-center shadow">
            <div class="card-body">
                <h3>{{ approved_requests }}</h3>
                <p>Approved Rentals</p>
            </div>
        </div>
    </div>

</div>

<hr>

<div class="mt-4">

    <a href="{% url 'add_book' %}"
       class="btn btn-success">

       Add Book

    </a>

    <a href="{% url 'my_books' %}"
       class="btn btn-primary">

       My Books

    </a>

    <a href="{% url 'owner_requests' %}"
       class="btn btn-warning">

       Rental Requests

    </a>

</div>

{% endblock %}
